name: Build & Publish Cloud Fleet GHCR Runner Image

on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * 0' # Every Sunday at 03:00 UTC
  push:
    paths:
      - 'Dockerfile'
      - 'requirements.txt'

jobs:
  build:
    name: Build & Push GHCR Runner
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/aaa0002/cloud-fleet-runner:latest
            ghcr.io/aaa0002/cloud-fleet-runner:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
